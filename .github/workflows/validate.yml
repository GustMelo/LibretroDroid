name: Validate library
on:
  push:
    branches: [multiplatform]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - run: scripts/test-native.sh
      - run: ./gradlew :netplay:testAndroidHostTest :libretrodroid:assembleRelease
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :netplay:iosSimulatorArm64Test
