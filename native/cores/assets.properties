# core|folder of its source to pack|what to leave out of it (an extended regex over the paths inside)
# PPSSPP draws its menus and the PSP's own dialogs from these; the debugger's web pages and the pad database are
# for its standalone app.
ppsspp|assets|debugger/|gamecontrollerdb\.txt|redump\.csv|sfx_.*\.wav|unknown\.png
# Dolphin's per-game settings, fonts and shaders (system/dolphin-emu/Sys); the themes and title lists are for its
# own window.
dolphin|Data/Sys|Themes/|Resources/|wiitdb-.*\.txt|totaldb\.dsy
# ARMSX2 will not boot without its resources (system/pcsx2/resources): the per-game fixes, shaders and fonts.
armsx2|bin/resources|game_controller_db\.txt|RedumpDatabase\.yaml
